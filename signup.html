<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox loginPage</title>
    <script src="https://kit.fontawesome.com/b3c375c83d.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="Images/final.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <!-- <h2>Bite<span style="color:red;">Box</span> -->
            <a href="./index.html"><img src="Images/logo.png" alt="logo"></a>
            </h2>
            <ul type="none">
                <li><a href="home.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="biteDeals.html">Bite Deals</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-plus"></i></a></li>
                <li><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i></a></li>
            </ul>
        </nav>
    </header>

    <section class="auth-container">

        <div class="auth" id="register">

            <h2> Sign Up Here </h2>

            <form action="login.html">

                <input type="text" id="name" placeholder="Enter Your Full Name" required>

                <input type="text" id="username" placeholder="Enter Your User Name" required>

                <input type="email" id="email" placeholder="Enter Your Email ID" required>

                <input type="number" id="gender" name="Enter Your Gender" placeholder="Enter Your Gender" required>

                <input type="password" id="password1" placeholder="Enter Your Password" required>

                <input type="password" id="password2" placeholder="Enter Your Confirm Password" required>

                <button type="submit" onclick="signup()"> Sign Up </button>
            </form>

            <p>Already Have An Account ? <a href="login.html"> Login </a> Here</p>

        </div>
        <h3 id="message"></h3>

    </section>

    <script src="./Js/signup.js"></script>
</body>

</html>
